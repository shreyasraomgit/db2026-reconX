<!doctype html>
<!--
============================================================================
TICKET-ADV106 — Advanced data table: sortable columns, resizable columns,
                frozen header while body scrolls
============================================================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Read saved theme before paint to avoid FOUC -->
  <script>
    (function () {
      var saved = localStorage.getItem('reconx-theme') || 'light';
      document.documentElement.dataset.theme = saved;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="layout__header" role="banner">
    <h1 class="layout__title">ReconX</h1>
    <nav class="layout__nav" aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="trades.html" aria-current="page">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle light/dark theme">&#127767;</button>
  </header>

  <aside class="layout__sidebar" role="complementary">
    <h2>Filters</h2>
    <ul>
      <li><a href="#">All trades</a></li>
      <li><a href="#">MATCHED</a></li>
      <li><a href="#">UNMATCHED</a></li>
      <li><a href="#">PENDING</a></li>
      <li><a href="#">CANCELLED</a></li>
    </ul>
  </aside>

  <main class="layout__main" role="main">
    <section aria-labelledby="tbl-heading">
      <h2 id="tbl-heading">Trade Blotter</h2>
      <!--
        .table-scroll provides the scroll container.
        CRITICAL: no overflow:hidden on any ancestor or position:sticky breaks.
      -->
      <div class="table-scroll">
        <table class="data-table" id="trades-table">
          <thead>
            <tr>
              <!-- data-col   = property name on the trade object (used by JS sort)  -->
              <!-- data-dir   = current sort direction; toggled on each click         -->
              <!-- data-type  = "number" for numeric sort, default is string          -->
              <th data-col="tradeRef"  data-dir="asc">Trade Ref   <span class="resize-handle"></span></th>
              <th data-col="symbol"    data-dir="asc">Instrument  <span class="resize-handle"></span></th>
              <th data-col="quantity"  data-dir="asc" data-type="number">Quantity <span class="resize-handle"></span></th>
              <th data-col="price"     data-dir="asc" data-type="number">Price    <span class="resize-handle"></span></th>
              <th data-col="status"    data-dir="asc">Status      <span class="resize-handle"></span></th>
              <th data-col="tradeDate" data-dir="asc">Date        <span class="resize-handle"></span></th>
            </tr>
          </thead>
          <tbody id="trades-tbody">
            <tr>
              <td colspan="6" style="text-align:center;padding:2rem;opacity:0.5">Loading trades…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="layout__footer" role="contentinfo">
    <small>ReconX TDI 2026 &middot; static dashboard (Day 7)</small>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
