spring:

  # TICKET-ADV060 — explicit here (safe local default) so reconxKafka
  # registers under uat, per @ConditionalOnProperty on KafkaHealthIndicator.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:reconx}
    username: ${POSTGRES_USER:reconx_user}
    password: ${POSTGRES_PASSWORD:reconx_pass}


  jpa:

    database-platform:
      org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: validate

reconx:
  security:
    jwt:
      secret: ${JWT_SECRET:uat-secret-change-me-32-bytes-min!!}
      expiration-minutes: ${JWT_EXP_MIN:60}
      issuer: reconx

logging:

  level:
    com.dbtraining.reconx: INFO