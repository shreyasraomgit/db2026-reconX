spring:

  # TICKET-ADV060 — explicit here (safe local default) so reconxKafka
  # registers under uat, per @ConditionalOnProperty on KafkaHealthIndicator.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  datasource:
    url: jdbc:postgresql://localhost:5432/reconx_uat
    username: reconx_uat
    password: reconx_uat


  jpa:

    database-platform:
      org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: validate


logging:

  level:
    com.dbtraining.reconx: INFO