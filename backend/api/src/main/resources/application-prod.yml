spring:

  # TICKET-ADV060 — no default: prod must fail fast if Kafka isn't configured.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  datasource:

    url: ${RECONX_DB_URL}

    username: ${RECONX_DB_USER}

    password: ${RECONX_DB_PASSWORD}


  jpa:

    database-platform:
      org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: validate

reconx:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXP_MIN:30}
      issuer: ${JWT_ISSUER:reconx}

logging:

  level:

    root: WARN

    com.dbtraining.reconx: INFO